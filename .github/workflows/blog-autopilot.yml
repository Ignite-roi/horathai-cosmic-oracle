name: Blog Autopilot

on:
  # ทุกวัน 07:00 น. เวลาไทย (00:00 UTC): AI เขียนบทความใหม่ → ลงเว็บ → แจ้ง IndexNow
  schedule:
    - cron: "0 0 * * *"
  # รันเองจากแท็บ Actions ได้
  workflow_dispatch:
    inputs:
      generate:
        description: "ให้ AI เขียนบทความใหม่ก่อนส่ง"
        type: boolean
        default: true
      target:
        description: "ปลายทาง"
        type: choice
        options: [production, preview]
        default: production
      force_update:
        description: "อัปเดตบทความที่มี slug อยู่แล้วด้วย"
        type: boolean
        default: false
      dry_run:
        description: "ทดสอบโดยไม่ยิงจริง"
        type: boolean
        default: false
  # เพิ่ม/แก้ไฟล์ใน posts/ เอง → ส่งขึ้นเว็บทันที (ไม่เรียก AI)
  push:
    branches: [main]
    paths: ["posts/**"]

permissions:
  contents: write

concurrency:
  group: blog-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: AI writes new post(s)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN || '1' }}
          POST_STATUS: ${{ vars.POST_STATUS || 'published' }}
        run: node scripts/generate-post.mjs

      - name: Save new post(s) to repo
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate)
        run: |
          git config user.name "horathai-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add posts/
          if git diff --cached --quiet; then echo "ไม่มีไฟล์ใหม่"; exit 0; fi
          git commit -m "blog: autopilot post $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Ingest posts + ping IndexNow
        env:
          BLOG_BASE_URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'preview') && (vars.PREVIEW_URL || 'https://project--ecf265fa-3f17-4a6f-bd0f-9ae9819e8573-dev.lovable.app') || (vars.PRODUCTION_URL || 'https://thaihora.app') }}
          AUTOPILOT_SECRET: ${{ secrets.AUTOPILOT_SECRET }}
          FORCE_UPDATE: ${{ inputs.force_update && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/publish-posts.mjs
